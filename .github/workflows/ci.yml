name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에서 새 실행이 시작되면 이전 실행은 취소한다. main 은 모든 실행을 끝까지 돌린다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v5

      - name: Node 설치
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: format:check
        run: npm run format:check

      # 가짜 값이다. 실제 키는 CI 에 넣지 않는다. 주소는 화면 테스트용 가짜 Supabase(e2e/fake-supabase.mjs).
      - name: test
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

      - name: 화면 테스트용 브라우저 설치
        run: npx playwright install --with-deps chromium

      # 위에서 만든 배포용 화면을 띄워 실제 브라우저로 쪽을 열어 본다.
      - name: test:e2e
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

      - name: 화면 테스트 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에서 새 실행이 시작되면 이전 실행은 취소한다. main 은 모든 실행을 끝까지 돌린다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v5

      - name: Node 설치
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: format:check
        run: npm run format:check

      # 가짜 값이다. 실제 키는 CI 에 넣지 않는다. 주소는 화면 테스트용 가짜 Supabase(e2e/fake-supabase.mjs).
      - name: test
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

      - name: 화면 테스트용 브라우저 설치
        run: npx playwright install --with-deps chromium

      # 위에서 만든 배포용 화면을 띄워 실제 브라우저로 쪽을 열어 본다.
      - name: test:e2e
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

      - name: 화면 테스트 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 이력 전체 받기
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks 설치
        run: |
          GITLEAKS_VERSION="8.30.1"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${CHECKSUMS}"

          grep "${ARCHIVE}" "${CHECKSUMS}" | sha256sum --check --status
          tar -xzf "${ARCHIVE}" gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm -f "${ARCHIVE}" "${CHECKSUMS}"
          gitleaks version

      - name: 자체 시험 (가짜 키 탐지 확인)
        run: |
          TMP_DIR=$(mktemp -d)
          # AWS Access Key ID 형식 (AKIA + A~Z, 2~7 16자). 저장소 파일에 온전한 키가 남지 않도록 분할 결합
          P1="AKIA"
          P2="234567QW"
          P3="ERTYUIOP"
          echo "aws_key=${P1}${P2}${P3}" > "${TMP_DIR}/fake_key.txt"

          if gitleaks dir --redact --verbose "${TMP_DIR}"; then
            echo "::error::gitleaks 가 가짜 키를 탐지하지 못했습니다."
            rm -rf "${TMP_DIR}"
            exit 1
          fi

          rm -rf "${TMP_DIR}"
          echo "정상: gitleaks 가 가짜 키를 성공적으로 탐지했습니다."

      - name: 저장소 비밀키 검사 (전체 이력)
        run: gitleaks git --redact --verbose .
